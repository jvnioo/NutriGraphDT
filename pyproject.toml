[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrigraphdt"
version = "0.1.0.dev0"
description = "Graph-based nutritional digital twin research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Representación tensorial del grafo (HeteroData). La versión mínima de PyG es la que citan
# DS-01 y VG-01; se verificó con torch 2.13.0 (CPU) y torch-geometric 2.8.0. Ver
# docs/development.md para instalar PyTorch sin CUDA.
graph = [
    "torch",
    "torch-geometric>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["nutrigraphdt"]

# torch-geometric no publica anotaciones de tipos (sin py.typed).
[[tool.mypy.overrides]]
module = ["torch_geometric.*"]
ignore_missing_imports = true
