[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrigraphdt"
version = "0.1.0.dev0"
description = "Graph-based nutritional digital twin research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Representación tensorial del grafo (HeteroData). La versión mínima de PyG es la que citan
# DS-01 y VG-01; se verificó con torch 2.13.0 (CPU) y torch-geometric 2.8.0. Ver
# docs/process/development.md para instalar PyTorch sin CUDA.
graph = [
    "torch",
    "torch-geometric>=2.7",
    # Configuración YAML de los modelos GNN (A41-8); licencia MIT, verificado con 6.0.3.
    "pyyaml>=6.0",
]
# Baselines no basados en grafos (A40-4, A40-5): modelos lineales, árboles y GroupKFold.
# Licencia BSD-3-Clause; se verificó con scikit-learn 1.9.1.
baselines = [
    "scikit-learn>=1.4",
]
# Figuras de diagnóstico de las GNN (A45-7, scripts/plot_gnn_runs.py). Licencia de Matplotlib
# (basada en la PSF, permisiva); se verificó con matplotlib 3.11.2.
plots = [
    "matplotlib>=3.8",
]
# Explicadores basados en gradientes (CaptumExplainer de PyG), opcional; solo lo usa la prueba
# de concepto de A55-P2 (#157, scripts/explainers_poc.py). Licencia BSD-3-Clause; se verificó
# con captum 0.9.0.
explain = [
    "captum>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["nutrigraphdt"]

# torch-geometric no publica anotaciones de tipos (sin py.typed).
[[tool.mypy.overrides]]
module = ["torch_geometric.*"]
ignore_missing_imports = true

# PyYAML no publica anotaciones de tipos (los stubs están en types-PyYAML).
[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# scikit-learn tampoco publica anotaciones de tipos.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# joblib (dependencia de scikit-learn) tampoco publica anotaciones de tipos.
[[tool.mypy.overrides]]
module = ["joblib.*"]
ignore_missing_imports = true
