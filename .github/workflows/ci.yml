name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # PyTorch CPU para el extra `graph`: evita descargar las ruedas CUDA.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,graph]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests
        # Falla si falta el extra `graph`, en vez de omitir las pruebas de HeteroData (A35-3).
        env:
          NUTRIGRAPHDT_REQUIRE_GRAPH: "1"
        run: pytest
